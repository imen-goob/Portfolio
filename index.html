<title>Imen Goob Portfolio</title>

<style>
  /* Layout: a fixed WebGL "embedding space" canvas sits behind one scrolling column.

  :root {

    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);

    line-height: 1.65;

    background: linear-gradient(90deg, rgb(var(--bg-rgb) / 0.9) 0%, rgb(var(--bg-rgb) / 0.58) 48%, rgb(var(--bg-rgb) / 0.12) 100%);
  }
  .page { position: relative; z-index: 2; overflow-x: clip; }

  /* HUD */
  .hud {
    position: fixed; z-index: 5;

  .hud i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Nav */
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;

  /* Hero */

  .meta { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }

  .about { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px 64px; }
  .about-main { display: grid; gap: 28px; align-content: start; }
  .about-photo { width: clamp(140px, 22vw, 220px); aspect-ratio: 1 / 1; object-fit: cover; object-position: center top; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 0 6px rgb(255 122 89 / 0.12), 0 18px 40px rgb(0 0 0 / 0.45); display: block; }
  .lead { font-size: clamp(1.25rem, 2.6vw, 1.75rem); line-height: 1.4; letter-spacing: -0.01em; max-width: 34ch; }

  .counts li { display: flex; flex-direction: column; }

  .counts span { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); margin-top: 6px; }

  /* Rows: experience, education, skills */

  /* Document viewer */
  .viewer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: rgb(6 8 14 / 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: vin 0.22s ease-out; }

  .v-bar { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 20px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }

  .v-rail { position: relative; display: flex; gap: 10px; overflow-x: auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: rgb(8 10 17 / 0.9); scrollbar-width: thin; }
  .v-thumb { flex: none; width: 96px; aspect-ratio: 3 / 2; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: #fff; cursor: pointer; opacity: 0.55; transition: opacity 0.2s, border-color 0.2s; }
  .v-thumb:hover { opacity: 0.9; }
  .v-thumb.on { opacity: 1; border-color: var(--accent); }
  .v-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

  .foot { border-top: 1px solid var(--line); padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); background: rgb(var(--bg-rgb) / 0.7); }
